name: Sync manuscript to Google Docs

on:
  push:
    branches: [main]
    paths: ['manuscript.qmd']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::googledrive
            any::gargle
            github::claudiozandonella/trackdown@develop

      - name: Write service account key
        env:
          TRACKDOWN_SA_KEY: ${{ secrets.TRACKDOWN_SA_KEY }}
        run: echo "$TRACKDOWN_SA_KEY" > /tmp/sa-key.json

      - name: Sync to Google Docs
        run: |
          library(googledrive)
          library(trackdown)

          # Authenticate with service account
          drive_auth(path = "/tmp/sa-key.json")
          trackdown_auth(token = drive_token())

          # Find the shared trackdown folder
          shared_folder <- drive_find(
            q = "name = 'trackdown' and mimeType = 'application/vnd.google-apps.folder' and not 'me' in owners"
          )
          if (nrow(shared_folder) == 0) stop("Shared trackdown/ folder not found")

          target_file <- drive_find(
            q = paste0("'", shared_folder$id, "' in parents and name = 'sleep-manuscript'")
          )

          # Process the qmd file with trackdown (hide code, extract text)
          file_info <- trackdown:::get_file_info("manuscript.qmd")
          document <- readLines("manuscript.qmd")
          hidden_doc <- trackdown:::hide_code(document, file_info)

          # Write processed text to temp file
          dir.create(".trackdown", showWarnings = FALSE)
          temp_file <- file.path(".trackdown", "manuscript.qmd")
          writeLines(hidden_doc, temp_file)

          if (nrow(target_file) == 0) {
            message("File not found — uploading for the first time...")
            drive_upload(
              media = temp_file,
              path = as_id(shared_folder$id),
              name = "sleep-manuscript",
              type = "document"
            )
            message("Successfully created sleep-manuscript in Google Docs!")
          } else {
            message("Found file: ", target_file$name, " (", target_file$id, ")")
            drive_update(
              file = target_file,
              media = temp_file
            )
            message("Successfully synced manuscript to Google Docs!")

            # Run rich text formatting
            tryCatch(
              trackdown:::run_rich_text(
                text = hidden_doc,
                document_ID = target_file$id,
                extension = "qmd"
              ),
              error = function(e) message("Rich text formatting skipped: ", e$message)
            )
          }
        shell: Rscript {0}

      - name: Clean up key
        if: always()
        run: rm -f /tmp/sa-key.json
