name: Sync manuscript to Google Docs

on:
  push:
    branches: [main]
    paths: ['manuscript.qmd']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::googledrive
            any::gargle
            github::claudiozandonella/trackdown@develop

      - name: Write service account key
        env:
          TRACKDOWN_SA_KEY: ${{ secrets.TRACKDOWN_SA_KEY }}
        run: echo "$TRACKDOWN_SA_KEY" > /tmp/sa-key.json

      - name: Sync to Google Docs
        run: |
          library(googledrive)
          library(trackdown)

          # Authenticate with service account
          drive_auth(path = "/tmp/sa-key.json")
          trackdown_auth(token = drive_token())

          # Try update first; fall back to upload on first run
          tryCatch({
            trackdown::update_file(
              file = "manuscript.qmd",
              gfile = "sleep-manuscript",
              hide_code = TRUE
            )
            message("Successfully updated sleep-manuscript in Google Docs!")
          }, error = function(e) {
            message("update_file failed (first run?): ", conditionMessage(e))
            message("Attempting upload_file...")
            trackdown::upload_file(
              file = "manuscript.qmd",
              gfile = "sleep-manuscript",
              gpath = "trackdown",
              hide_code = TRUE
            )
            message("Successfully created sleep-manuscript in Google Docs!")
          })
        shell: Rscript {0}

      - name: Clean up key
        if: always()
        run: rm -f /tmp/sa-key.json
